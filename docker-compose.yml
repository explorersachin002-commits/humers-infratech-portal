services:
  humers-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: humers_infratech_portal
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=humers_infratech_prod_secret_change_me
      - COOKIE_SECURE=false
      - UPLOAD_MAX_MB=50
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
