# Nginx Production Reverse Proxy Configuration for Humers Infratech
# Place in /etc/nginx/sites-available/humers-infratech and symlink to sites-enabled

server {
    listen 80;
    server_name yourcompanydomain.com www.yourcompanydomain.com;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yourcompanydomain.com www.yourcompanydomain.com;

    # SSL Certificates (managed by Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/yourcompanydomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourcompanydomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow uploads up to 50MB
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse proxy to Node.js application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
